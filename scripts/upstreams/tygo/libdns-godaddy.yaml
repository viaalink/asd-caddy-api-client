# tygo configuration for generating TypeScript from the real Provider struct
# behind caddy-dns/godaddy (github.com/caddy-dns/godaddy embeds
# *libdns.Provider, contributing zero fields of its own — the real
# JSON-tagged struct lives here).
# Run from local/libdns-godaddy directory: tygo generate

packages:
  - path: "github.com/libdns/godaddy"
    output_path: "../../src/generated/plugins/caddy-dns-godaddy.ts"
