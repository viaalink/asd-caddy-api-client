# tygo configuration for generating TypeScript from the real Provider struct
# behind caddy-dns/digitalocean (github.com/caddy-dns/digitalocean embeds
# *libdns.Provider, contributing zero fields of its own — the real
# JSON-tagged struct lives here).
# Run from local/libdns-digitalocean directory: tygo generate

packages:
  - path: "github.com/libdns/digitalocean"
    output_path: "../../src/generated/plugins/caddy-dns-digitalocean.ts"
