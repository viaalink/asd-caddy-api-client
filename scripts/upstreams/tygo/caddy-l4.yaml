# tygo configuration for the caddy-l4 (layer4) plugin: github.com/mholt/caddy-l4
#
# Tracked in the repo (local/ is gitignored); scripts/generate-plugin-types.ts runs
#   tygo --config <this file> generate
# from local/caddy-l4, so output paths are relative to that directory.
# Pinned commit: see DEPENDENCIES.md.
#
# One package per output file: the modules reuse names (Handler, MatchRegexp, ...).
# Cross-package references (caddy.Duration, layer4.RouteList, caddytls.ConnectionPolicies,
# reverseproxy.TLSConfig) are resolved to imports by scripts/resolve-cross-refs.ts.
# Files that only hold wire-protocol parsing or runtime state are excluded, and the
# generator strips runtime `export const` lines (byte sizes, opcodes) for this plugin.

x-mappings: &mappings
  "json.RawMessage": "unknown"
  "time.Duration": "number | string"
  "error": "Error"
  "*zap.Logger": "unknown"

packages:
  - path: "github.com/mholt/caddy-l4/layer4"
    output_path: "../../src/generated/plugins/caddy-l4-core.ts"
    type_mappings: *mappings
    # wire-protocol / runtime internals, no JSON config
    exclude_files:
      - "connection.go"
      - "handlers.go"
      - "caddyfile.go"
  - path: "github.com/mholt/caddy-l4/modules/l4clock"
    output_path: "../../src/generated/plugins/caddy-l4-clock.ts"
    type_mappings: *mappings
  - path: "github.com/mholt/caddy-l4/modules/l4close"
    output_path: "../../src/generated/plugins/caddy-l4-close.ts"
    type_mappings: *mappings
