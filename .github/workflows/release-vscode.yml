name: Release & Publish VS Code Extension

on:
  push:
    tags:
      - "vscode-v*.*.*"

permissions:
  contents: write
  id-token: write # Marketplace trusted publishing (OIDC), no PAT

jobs:
  release:
    name: Build, Test & Publish vscode-caddy-tools
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Build main library
        run: bun run build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install extension dependencies
        working-directory: vscode-extension
        run: npm ci

      # esbuild bundles without type checking; this is what catches a typo'd
      # VS Code API call (appendCodeBlock once broke every handler hover).
      - name: Type check extension
        working-directory: vscode-extension
        run: npm run typecheck

      - name: Install Playwright browsers
        working-directory: vscode-extension
        run: npx playwright install chromium --with-deps

      - name: Run extension tests
        working-directory: vscode-extension
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" npm test
        env:
          CI: true

      - name: Package extension (.vsix)
        working-directory: vscode-extension
        run: npm run package

      # Trusted publishing: the "viaalink" publisher trusts this workflow
      # (viaalink/asd-caddy-api-client, release-vscode.yml) through OIDC, so
      # no Azure DevOps token is stored. Publishes the .vsix built and tested
      # above instead of packaging again.
      - name: Publish to Visual Studio Marketplace
        working-directory: vscode-extension
        run: npx vsce publish --oidc --packagePath vscode-caddy-tools-*.vsix

      # Optional: also publish to Open VSX (serves VSCodium and other
      # non-Microsoft-branded editors). Requires the OVSX_PAT repo secret
      # from https://open-vsx.org — skipped entirely if not configured.
      # `secrets` is not allowed in a step `if` (it made this whole workflow
      # file invalid); the token goes through env and the step checks that.
      - name: Publish to Open VSX
        working-directory: vscode-extension
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT not configured; skipping Open VSX" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm run publish:ovsx

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          artifacts: "vscode-extension/*.vsix"
          generateReleaseNotes: true
          allowUpdates: true
