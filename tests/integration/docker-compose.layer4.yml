# SQL over TCP: Caddy (caddy-l4) in front of Postgres, mitmproxy in reverse TCP
# mode with the package's own pgwire addon. The tests build the layer4 server
# through the library and swap its route between Postgres and mitmproxy.
#
#   Caddy admin   127.0.0.1:2021
#   Postgres via Caddy (layer4 listener, created by the tests)   127.0.0.1:15432
#   mitmweb UI / API                                             127.0.0.1:18081
#     (mitmproxy 11.1+ wants a password: Authorization: Bearer layer4-test)
#
# Postgres has a second user, `clear`, that logs in with a CLEARTEXT password
# (pg_hba `password`), to prove the addon hides it from the stored flow.
# LAYER4_MITMPROXY_VERSION picks another mitmproxy (default 12.2.1, what the
# Viaalink CLI installs); 10.4.2 runs the addon's older content view API.
name: caddy-layer4-test
services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy-l4
    command: caddy run --config /etc/caddy/caddy.json
    volumes:
      - ./layer4/caddy.json:/etc/caddy/caddy.json:ro
    ports:
      - "127.0.0.1:2021:2019"
      - "127.0.0.1:15432:5432"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: shop
    volumes:
      - ./layer4/pg-cleartext-user.sh:/docker-entrypoint-initdb.d/pg-cleartext-user.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "demo", "-d", "shop"]
      interval: 2s
      timeout: 3s
      retries: 30

  mitmproxy:
    image: mitmproxy/mitmproxy:${LAYER4_MITMPROXY_VERSION:-12.2.1}
    command: >
      mitmweb --mode reverse:tcp://postgres:5432@5432
      --web-host 0.0.0.0 --web-port 8081 --set web_password=layer4-test
      -s /addons/pgwire.py
    volumes:
      - ../../mitmproxy-addons:/addons:ro
    ports:
      - "127.0.0.1:18081:8081"
