# MITMproxy Traffic Inspection Demo
# Shows dynamic route switching via Caddy Admin API.
# Ports and names come from tpl.env (via env init), so clones never collide:
#   docker compose --env-file .env -f demo/docker-compose.yml up -d

name: ${COMPOSE_PROJECT_NAME:-caddy-mitm-demo}

services:
  # Caddy reverse proxy with Admin API
  caddy:
    # Caddy with caddy-l4: the HTTP routes and the layer4 route to Postgres
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: ${COMPOSE_PROJECT_NAME:-caddy-mitm-demo}-caddy
    ports:
      - "127.0.0.1:${DEMO_HTTP_PORT:-9080}:80" # HTTP
      - "127.0.0.1:${DEMO_ADMIN_PORT:-9019}:2019" # Admin API
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      - DEMO_ADMIN_PORT=${DEMO_ADMIN_PORT:-9019}
    networks:
      - demo-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2019/config/"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Elasticsearch backend
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: ${COMPOSE_PROJECT_NAME:-caddy-mitm-demo}-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      # Single-node demo: don't refuse the index when the host disk is >90% full
      - cluster.routing.allocation.disk.threshold_enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:${DEMO_ES_PORT:-9200}:9200"
    networks:
      - demo-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # MITMproxy for Elasticsearch (reverse mode)
  mitmproxy:
    image: mitmproxy/mitmproxy:12.2.1
    container_name: ${COMPOSE_PROJECT_NAME:-caddy-mitm-demo}-mitmproxy
    command: >
      mitmweb
      --mode reverse:http://elasticsearch:9200
      --web-host 0.0.0.0
      --web-port 8081
      --listen-host 0.0.0.0
      --listen-port 8080
      --no-web-open-browser
      --set web_password=${DEMO_MITMWEB_PASSWORD:-demo}
      --set keep_host_header=true
      --set block_global=false
    ports:
      - "127.0.0.1:${DEMO_MITM_PROXY_PORT:-9082}:8080" # Proxy port
      - "127.0.0.1:${DEMO_MITM_WEB_PORT:-9081}:8081" # Web UI
    networks:
      - demo-net
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -c "import urllib.request; urllib.request.urlopen(''http://localhost:8081/?token=${DEMO_MITMWEB_PASSWORD:-demo}'')"',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # MITMproxy for Node API (reverse mode)
  mitmproxy-node:
    image: mitmproxy/mitmproxy:12.2.1
    container_name: ${COMPOSE_PROJECT_NAME:-caddy-mitm-demo}-mitmproxy-node
    command: >
      mitmweb
      --mode reverse:http://demo-api:3000
      --web-host 0.0.0.0
      --web-port 8081
      --listen-host 0.0.0.0
      --listen-port 8080
      --no-web-open-browser
      --set web_password=${DEMO_MITMWEB_PASSWORD:-demo}
      --set keep_host_header=true
      --set block_global=false
    ports:
      - "127.0.0.1:${DEMO_MITM_NODE_PROXY_PORT:-9084}:8080" # Proxy port
      - "127.0.0.1:${DEMO_MITM_NODE_WEB_PORT:-9083}:8081" # Web UI
    networks:
      - demo-net
    depends_on:
      - demo-api
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -c "import urllib.request; urllib.request.urlopen(''http://localhost:8081/?token=${DEMO_MITMWEB_PASSWORD:-demo}'')"',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Postgres: the same products, for the SQL side of the demo
  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-caddy-mitm-demo}-postgres
    environment:
      - POSTGRES_USER=demo
      - POSTGRES_PASSWORD=demo
      - POSTGRES_DB=shop
    volumes:
      - ./data:/data:ro
      - ./seed/postgres.sql:/docker-entrypoint-initdb.d/products.sql:ro
    networks:
      - demo-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "demo", "-d", "shop"]
      interval: 3s
      timeout: 3s
      retries: 20

  # MITMproxy for Postgres (reverse TCP mode, with the package's pgwire addon:
  # the SQL, its parameters, the rows and errors, readable in Stream Data)
  mitmproxy-pg:
    image: mitmproxy/mitmproxy:12.2.1
    container_name: ${COMPOSE_PROJECT_NAME:-caddy-mitm-demo}-mitmproxy-pg
    command: >
      mitmweb
      --mode reverse:tcp://postgres:5432@5432
      --web-host 0.0.0.0
      --web-port 8081
      --no-web-open-browser
      --set web_password=${DEMO_MITMWEB_PASSWORD:-demo}
      -s /addons/pgwire.py
    volumes:
      - ../mitmproxy-addons:/addons:ro
    ports:
      - "127.0.0.1:${DEMO_MITM_PG_WEB_PORT:-9086}:8081" # Web UI
    networks:
      - demo-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -c "import urllib.request; urllib.request.urlopen(''http://localhost:8081/?token=${DEMO_MITMWEB_PASSWORD:-demo}'')"',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Demo API server (Bun + caddy-api-client library)
  demo-api:
    build:
      context: ..
      dockerfile: demo/Dockerfile.api
    container_name: ${COMPOSE_PROJECT_NAME:-caddy-mitm-demo}-api
    ports:
      - "127.0.0.1:${DEMO_API_PORT:-9085}:3000" # Demo API (direct, for debugging)
    environment:
      - CADDY_ADMIN_URL=http://caddy:2019
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      # Postgres through Caddy's layer4 route, so inspection can swap it
      - DATABASE_URL=postgres://demo:demo@caddy:5432/shop
      # mitmweb 11.1+ wants a password; Caddy passes it on to the mitmweb UIs
      - MITMWEB_PASSWORD=${DEMO_MITMWEB_PASSWORD:-demo}
    volumes:
      - ./app:/app/public:ro
      - ./api/server.ts:/app/demo/server.ts:ro
    networks:
      - demo-net
    depends_on:
      caddy:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      mitmproxy:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Seed sample data into Elasticsearch
  seed:
    image: alpine:latest
    container_name: ${COMPOSE_PROJECT_NAME:-caddy-mitm-demo}-seed
    volumes:
      - ./data:/data:ro
      - ./seed/seed.sh:/seed.sh:ro
    networks:
      - demo-net
    depends_on:
      elasticsearch:
        condition: service_healthy
    entrypoint: ["sh", "-c", "apk add --no-cache curl jq && sh /seed.sh"]

networks:
  demo-net:
    driver: bridge
